  - Version: 0.2.0
    RequiredApiVersion: 6.11.0
    ReleaseDate: 2026-07-29
    PackageUrl: https://github.com/Yalgrin/playnite-simple-sync-plugin/releases/download/0.2.0/Yagrin_SimpleSyncPlugin_0_2_0.pext
    Changelog:
      - Important! Requires update to Sync Server version 0.2.0 or higher.
      - New feature - Registration system. You now need to register the Playnite instance to the server. You can do that in the plugin settings. It's one and done operation, but is required for tracking which client has made the changes.
      - New feature - Version checking. The server will now verify if the running version of the plugin is compatible. The plugin will disable itself if the version is incompatible.
      - Other - Various small refactors and bug fixes.
